<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIS-DF 통합 퀴즈</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../shared/quiz-common.css">
</head>

<body>
  <div class="top-home-bar">
    <div class="top-home-inner">
      <div class="top-home-links">
        <a href="../index.html">홈</a>
        <a href="index.html">CIS-DF 홈</a>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="panel">
      <div class="top">
        <h1>CIS-DF 통합 퀴즈</h1>
      </div>

      <div id="start-screen">
        <p class="start-note">문제 풀에서 랜덤 출제합니다. 채점은 전체 완료 시 진행됩니다.</p>
        <div class="mode-grid">
          <div class="mode practice">
            <h2>연습 모드</h2>
            <p>랜덤 10문항. 시간 제한 없음. 전부 응답 후 채점. 해설 확인 가능.</p>
            <button onclick="startSession('practice')">연습 시작</button>
          </div>
          <div class="mode exam">
            <h2>실전 모드</h2>
            <p>랜덤 75문항. 90분 제한. 전부 응답 또는 시간 종료 시 채점.</p>
            <button onclick="startSession('exam')">실전 시작</button>
          </div>
        </div>
        <p id="pool-info" class="pool-info"></p>
      </div>

      <div id="quiz-screen">
        <div class="stat">
          <div class="metric">
            <div class="v" id="mode-label">연습</div>
            <div class="l">모드</div>
          </div>
          <div class="metric">
            <div class="v" id="q-counter">1 / 10</div>
            <div class="l">진행</div>
          </div>
          <div class="metric">
            <div class="v" id="timer">--:--</div>
            <div class="l">남은 시간</div>
          </div>
        </div>
        <div class="progress">
          <div id="progress"></div>
        </div>
        <div class="question">
          <h3 id="q-title"></h3>
          <div id="options"></div>
        </div>
        <p class="notice" id="notice"></p>
        <div class="actions">
          <button class="btn" id="prev-btn" onclick="moveQuestion(-1)">이전</button>
          <button class="btn primary" id="next-btn" onclick="moveQuestion(1)">다음</button>
          <button class="btn finish" id="submit-btn" onclick="finishQuiz()">채점하기</button>
        </div>
      </div>

      <div id="result-screen">
        <h2 id="result-title">결과</h2>
        <div class="score">
          <div class="big" id="result-score">0 / 0</div>
          <div class="small" id="result-percent">정답률 0%</div>
        </div>
        <p class="summary" id="result-summary"></p>
        <div id="practice-review" class="review-wrap">
          <h3>연습 모드 해설</h3>
          <div id="review-list"></div>
        </div>
        <div class="actions result-actions">
          <button class="btn primary" onclick="location.href='index.html'">CIS-DF 홈으로 돌아가기</button>
          <button class="btn" onclick="location.href='../index.html'">홈</button>
          <button class="btn" onclick="location.reload()">다시 시작</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/quiz-engine.js"></script>
  <script src="cisdf_questions.js"></script>
  <script>
    window.initIntegratedQuiz({
      questions: window.CISDF_QUESTIONS,
      questionPrefix: 'Q'
    });
  </script>
</body>

</html>
