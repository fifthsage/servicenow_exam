<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAD 통합 퀴즈 · 초안</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/quiz-common.css"></head><body>
<div class="top-home-bar"><div class="top-home-inner"><div class="top-home-links"><a href="../index.html">홈</a><a href="index.html">CAD 홈</a></div></div></div><div class="wrap"><div class="panel"><div class="top"><h1>CAD 통합 퀴즈 · 초안</h1></div>
<div id="invalid-screen" class="invalid-wrap"><h2>잘못된 접근입니다</h2><p>유효한 모드가 필요합니다: all, random, exam, wrong</p><div class="actions"><button class="btn primary" onclick="location.href='index.html'">허브로 이동</button></div></div>
<div id="start-screen"><p class="start-note">CAD 공식 Blueprint 기반 초안 문제 풀입니다.</p><div class="mode-grid"><div class="mode all"><h2>전체 문제 풀이</h2><p>전체 문항을 순서대로 학습합니다.</p><button onclick="startSession('all')">전체 시작</button></div><div class="mode random"><h2>랜덤 문제 풀이</h2><p>원하는 수만큼 무작위 출제합니다.</p><div class="random-counts"><button onclick="startSession('random',10)">10</button><button onclick="startSession('random',20)">20</button><button onclick="startSession('random',30)">30</button><button onclick="startSession('random','all')">전체</button></div></div><div class="mode exam"><h2>실전 모드</h2><p><span id="exam-summary"></span>. 종료 시 채점합니다.</p><button onclick="startSession('exam')">실전 시작</button></div><div class="mode wrong"><h2>오답 모드</h2><p>저장된 오답만 다시 풉니다.</p><button id="wrong-mode-btn" onclick="startSession('wrong')" disabled>오답 없음</button></div></div><p id="pool-info" class="pool-info"></p><p id="wrong-info" class="pool-info">저장된 오답 0문항</p><div class="actions start-actions"><button class="btn" id="wrong-reset-btn" onclick="clearWrongQuestions()" disabled>오답 초기화</button></div></div>
<div id="quiz-screen"><div class="stat"><div class="metric"><div class="v" id="mode-label">연습</div><div class="l">모드</div></div><div class="metric"><div class="v" id="q-counter">1 / 10</div><div class="l">진행</div></div><div class="metric"><div class="v" id="timer">--:--</div><div class="l">남은 시간</div></div></div><div class="progress"><div id="progress"></div></div><div class="question"><h3 id="q-title"></h3><div id="options"></div></div><p class="notice" id="notice"></p><div class="actions"><button class="btn" id="prev-btn" onclick="moveQuestion(-1)">이전</button><button class="btn primary" id="next-btn" onclick="moveQuestion(1)">다음</button><button class="btn finish" id="submit-btn" onclick="finishQuiz()">채점하기</button></div></div>
<div id="result-screen"><h2 id="result-title">결과</h2><div class="score"><div class="big" id="result-score">0 / 0</div><div class="small" id="result-percent">정답률 0%</div></div><p class="summary" id="result-summary"></p><div id="practice-review" class="review-wrap"><h3>풀이 해설</h3><div id="review-list"></div></div><div class="actions result-actions"><div class="result-home-group"><button class="btn" onclick="location.href='../index.html'">홈</button><button class="btn primary" onclick="location.href='index.html'">CAD 홈</button></div><div class="result-retry-group"><button class="btn result-wrong-review" id="result-wrong-review-btn" onclick="startWrongReview()" disabled>오답 없음</button><button class="btn" onclick="restartCurrentMode()">다시 시작</button></div></div></div></div></div>
<script src="../shared/exam-config.js"></script><script src="../shared/quiz-policy.js"></script><script src="../shared/quiz-engine.js"></script><script src="cad_questions.js"></script><script>window.initIntegratedQuiz({questions:window.CAD_QUESTIONS,questionPrefix:'Q',examKey:'CAD',wrongStorageKey:'sn_quiz_wrong_cad',wrongModeFlagKey:'sn_quiz_mode_wrong_cad'});document.getElementById('exam-summary').textContent=window.ExamConfig.formatSummary('CAD','. ');</script></body></html>
